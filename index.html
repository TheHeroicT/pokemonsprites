<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Sprites Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .sprite-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .sprite-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }
        
        .sprite-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: #f5f5f5;
            padding: 10px;
        }
        
        .sprite-name {
            padding: 15px;
            background: #f9f9f9;
            font-weight: 600;
            color: #333;
            text-align: center;
            font-size: 0.9em;
            word-break: break-word;
        }
        
        .loading {
            color: white;
            text-align: center;
            font-size: 1.2em;
        }
        
        .error {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Pokémon Sprites Gallery</h1>
        <div id="gallery" class="gallery">
            <div class="loading">Loading sprites...</div>
        </div>
    </div>

    <script>
        async function loadSprites() {
            try {
                // Fetch the contents of the sprites directory
                const response = await fetch('https://api.github.com/repos/TheHeroicT/pokemonsprites/contents/sprites');
                const files = await response.json();
                
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = '';
                
                if (!Array.isArray(files)) {
                    gallery.innerHTML = '<div class="error">No sprites found. Add image files to the /sprites/ directory.</div>';
                    return;
                }
                
                const imageFiles = files.filter(file => /\.(png|jpg|jpeg|gif|webp)$/i.test(file.name));
                
                if (imageFiles.length === 0) {
                    gallery.innerHTML = '<div class="error">No image files found in the sprites directory.</div>';
                    return;
                }
                
                imageFiles.forEach(file => {
                    const card = document.createElement('div');
                    card.className = 'sprite-card';
                    card.innerHTML = `
                        <img src="${file.download_url}" alt="${file.name}" class="sprite-image" onerror="this.style.display='none'">
                        <div class="sprite-name">${file.name}</div>
                    `;
                    gallery.appendChild(card);
                });
                
            } catch (error) {
                document.getElementById('gallery').innerHTML = `<div class="error">Error loading sprites: ${error.message}</div>`;
            }
        }
        
        loadSprites();
    </script>
</body>
</html>
